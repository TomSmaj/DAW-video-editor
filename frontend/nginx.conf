server {
    listen 80;

    location / {
        root /usr/share/nginx/html;
        try_files $uri $uri/ /index.html;
    }

    location /api {
        proxy_pass http://backend:3001;
        proxy_set_header Host $host;
    }

    location /clips {
        proxy_pass http://backend:3001;
        proxy_set_header Host $host;
    }

    location /music {
        proxy_pass http://backend:3001;
        proxy_set_header Host $host;
    }

    location /thumbnails {
        proxy_pass http://backend:3001;
        proxy_set_header Host $host;
    }

    location /exports {
        proxy_pass http://backend:3001;
        proxy_set_header Host $host;
    }
}
