version: '3.8'

services:
  backend:
    build: ./backend
    ports:
      - "3001:3001"
    volumes:
      - ${CLIPS_DIR:-./media/clips}:/media/clips
      - ${MUSIC_DIR:-./media/music}:/media/music
      - ./media/thumbnails:/media/thumbnails
      - ./media/exports:/media/exports
      - ${PROJECTS_DIR:-./media/projects}:/media/projects
    environment:
      - CLIPS_DIR=/media/clips
      - MUSIC_DIR=/media/music
      - THUMBNAILS_DIR=/media/thumbnails
      - EXPORTS_DIR=/media/exports
      - PROJECTS_DIR=/media/projects
    restart: unless-stopped

  frontend:
    build: ./frontend
    ports:
      - "3000:80"
    depends_on:
      - backend
    restart: unless-stopped
